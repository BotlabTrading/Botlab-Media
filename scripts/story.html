<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#07090c;color:#e9edf2;font-family:'Inter Display','Inter',sans-serif;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:90px 90px}
.glow{position:absolute;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(46,204,113,.18),transparent 65%);top:380px;left:-10px}
.wrap{position:absolute;inset:0;padding:150px 90px 130px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:22px}
.logo{width:84px;height:84px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;gap:5px}
.logo i{display:block;width:6px;background:#07090c;border-radius:3px}
.bname{font-size:46px;font-weight:800;letter-spacing:8px}
.tag{margin-top:90px;font-size:30px;letter-spacing:7px;color:#2ecc71;font-weight:600}
h1{font-size:96px;line-height:1.02;font-weight:800;margin-top:22px;letter-spacing:-1px}
.date{font-size:34px;color:#8a96a3;margin-top:24px;font-weight:500}
.hero{margin-top:80px}
.hero .lbl{font-size:32px;color:#8a96a3;letter-spacing:4px;font-weight:600}
.hero .val{font-size:230px;font-weight:800;line-height:1;letter-spacing:-6px;margin-top:10px;font-variant-numeric:tabular-nums}
.rows{margin-top:70px;border-top:2px solid #1d242c}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:30px 0;border-bottom:2px solid #1d242c;font-size:46px;font-variant-numeric:tabular-nums}
.row span:first-child{color:#aab4bf;font-weight:500}
.row b{font-weight:700}
.pos{color:#2ecc71}.hero .val.pos{color:#2ecc71}.hero .val.neg{color:#ff5a5a}.neg{color:#ff5a5a}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:30px;color:#8a96a3}
.foot b{color:#e9edf2;font-weight:700}
.pill{border:2px solid #2ecc71;color:#2ecc71;padding:14px 28px;border-radius:40px;font-weight:700;letter-spacing:1px}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
 <div class="brand"><img src="__LOGO__" style="width:300px;height:auto;display:block"></div>
 <div class="tag">RESULTADOS EN REAL</div>
 <h1>Breakout Pro</h1>
 <div class="date">__FECHA__</div>
 <div class="hero"><div class="lbl">__HEROLBL__</div><div class="val __CH__">__HOY__</div></div>
 <div class="rows">
  <div class="row"><span>Semana</span><b class="__CS__">__SEM__</b></div>
  <div class="row"><span>Mes</span><b class="__CM__">__MES__</b></div>
  <div class="row"><span>Año</span><b class="__CA__">__ANO__</b></div>
  <div class="row"><span>Max DD</span><b>__DD__</b></div>
  <div class="row"><span>Win rate</span><b>__WR__</b></div>
 </div>
 <div class="foot"><div>Resultados diarios en Telegram</div><div class="pill">t.me/BOTLABTRADING</div></div>
</div></body></html>
